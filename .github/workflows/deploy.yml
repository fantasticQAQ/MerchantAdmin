name: Build, Migrate and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Build Images
      run: |
        docker build -t merchant-api:${{ github.sha }} -t merchant-api:latest -f src/MerchantAdmin.API/Dockerfile .
        docker build -t identity-api:${{ github.sha }} -t identity-api:latest -f src/Identity.API/Dockerfile .
        docker build -t merchant-admin-frontend:${{ github.sha }} -t merchant-admin-frontend:latest -f src/MerchantAdmin.Frontend/Dockerfile .
        docker build -t db-migrator:${{ github.sha }} -t db-migrator:latest -f build/Dockerfile.migrate .



  deploy:
    needs: [build]
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Update K8s manifests and Deploy
      shell: powershell
      run: |
        # 替换镜像 Tag
        (Get-Content build/k8s/07-merchant-api.yaml) -replace 'merchant-api:latest', 'merchant-api:${{ github.sha }}' | Set-Content build/k8s/07-merchant-api.yaml
        (Get-Content build/k8s/06-identity-api.yaml) -replace 'identity-api:latest', 'identity-api:${{ github.sha }}' | Set-Content build/k8s/06-identity-api.yaml
        (Get-Content build/k8s/08-merchantadmin.yaml) -replace 'merchant-admin-frontend:latest', 'merchant-admin-frontend:${{ github.sha }}' | Set-Content build/k8s/08-merchantadmin.yaml
        (Get-Content build/k8s/identity-db-migrate-job.yaml) -replace 'db-migrator:latest', 'db-migrator:${{ github.sha }}' | Set-Content build/k8s/identity-db-migrate-job.yaml
        (Get-Content build/k8s/merchant-db-migrate-job.yaml) -replace 'db-migrator:latest', 'db-migrator:${{ github.sha }}' | Set-Content build/k8s/merchant-db-migrate-job.yaml

        # 迁移
        kubectl apply -f build/k8s/identity-db-migrate-job.yaml
        kubectl apply -f build/k8s/merchant-db-migrate-job.yaml
        kubectl wait --for=condition=complete job/merchant-db-migrate -n merchant --timeout=120s
        kubectl wait --for=condition=complete job/identity-db-migrate -n merchant --timeout=120s

        # 部署应用
        kubectl apply -f build/k8s/06-identity-api.yaml
        kubectl apply -f build/k8s/07-merchant-api.yaml
        kubectl apply -f build/k8s/08-merchantadmin.yaml
        kubectl apply -f build/k8s/09-nginx-ingress.yaml

        # 等待就绪
        kubectl wait --for=condition=ready pod -l app=identity-api -n merchant --timeout=120s
        kubectl wait --for=condition=ready pod -l app=merchant-api -n merchant --timeout=120s
        kubectl wait --for=condition=ready pod -l app=merchantadmin -n merchant --timeout=120s

        # 清理旧镜像，每个服务保留当前版本 + 1个旧版本
        $services = @("merchant-api", "identity-api", "merchant-admin-frontend", "db-migrator")

        foreach ($svc in $services) {
            # 获取该服务所有 Image ID，按创建时间倒序，去重
            $imageIds = docker images --format "{{.ID}}" $svc | Get-Unique
            
            # 按创建时间排序（需要 inspect 拿 Created）
            $sortedIds = $imageIds | Sort-Object {
                docker inspect $_ --format '{{.Created}}'
            } -Descending
            
            # 保留最近 2 个 Image ID，其余全删
            $toDelete = $sortedIds | Select-Object -Skip 2
            
            foreach ($id in $toDelete) {
                docker rmi $id
            }
        }
        