  name: merchant-secrets
  namespace: merchant
type: Opaque
stringData:
  sqlserver-sa-password: "P@ssw0rd2024!"
  identity-connectionString: "Server=sqlserver,1433;Database=MerchantAdmin.Identity;User Id=sa;Password=P@ssw0rd2024!;TrustServerCertificate=True;"
  merchant-connectionString: "Server=sqlserver,1433;Database=MerchantAdmin.Merchant;User Id=sa;Password=P@ssw0rd2024!;TrustServerCertificate=True;"
  internalApi-key: "MerchantAdmin_InternalApi_Key_ChangeMe"
  seq-admin-password: "12345678"
  redis-connectionString: "redis:6379,abortConnect=false,connectTimeout=10000,syncTimeout=10000,asyncTimeout=10000"
