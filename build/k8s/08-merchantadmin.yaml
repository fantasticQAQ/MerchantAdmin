# ========================================
# MerchantAdmin (前端)
# 使用 ConfigMap 注入正确的 nginx.conf
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchantadmin
  namespace: merchant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchantadmin
  template:
    metadata:
      labels:
        app: merchantadmin
    spec:
      containers:
      - name: merchantadmin
        image: merchant-admin-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        # 用 ConfigMap 覆盖容器内的 nginx.conf
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: merchantadmin
  namespace: merchant
spec:
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: merchantadmin
  type: ClusterIP