# ========================================
# Merchant API
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-api
  namespace: merchant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-api
  template:
    metadata:
      labels:
        app: merchant-api
    spec:
      initContainers:
      - name: wait-for-sqlserver
        image: alpine:3.19
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          apk add --no-cache netcat-openbsd
          echo "Waiting for SQL Server..."
          until nc -z sqlserver.merchant.svc.cluster.local 1433; do
            sleep 2
          done
          echo "SQL Server is ready!"
      - name: wait-for-redis
        image: alpine:3.19
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          apk add --no-cache netcat-openbsd
          echo "Waiting for Redis..."
          until nc -z redis.merchant.svc.cluster.local 6379; do
            sleep 2
          done
          echo "Redis is ready!"
      - name: wait-for-rabbitmq
        image: alpine:3.19
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          apk add --no-cache netcat-openbsd
          echo "Waiting for RabbitMQ..."
          until nc -z rabbitmq.merchant.svc.cluster.local 5672; do
            sleep 2
          done
          echo "RabbitMQ is ready!"
      - name: wait-for-seq
        image: alpine:3.19
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          apk add --no-cache netcat-openbsd
          echo "Waiting for Seq..."
          until nc -z seq.merchant.svc.cluster.local 5341; do
            sleep 2
          done
          echo "Seq is ready!"
      containers:
      - name: merchant-api
        image: merchant-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ConnectionStrings__Default
          value: |
            Server=sqlserver,1433;
            Database=MerchantAdmin;
            User Id=sa;
            Password=$(SA_PASSWORD);
            TrustServerCertificate=True;
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: sqlserver-sa-password
        - name: Seq__ServerUrl
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: seq-server
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-api
  namespace: merchant
spec:
  ports:
  - port: 5002
    targetPort: 8080
    name: http
  selector:
    app: merchant-api
  type: ClusterIP