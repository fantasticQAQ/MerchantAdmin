apiVersion: batch/v1
kind: Job
metadata:
  name: identity-db-migrate
  namespace: merchant
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: db-migrator:latest
        command: ["/opt/mssql-tools18/bin/sqlcmd"]
        args:
        - "-S"
        - "sqlserver"
        - "-U"
        - "sa"
        - "-C"
        - "-b"
        - "-i"
        - "/scripts/Identity.sql"
        env:
        - name: SQLCMDPASSWORD
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: sqlserver-sa-password