# ========================================
# Seq (日志系统)
# ========================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seq
  namespace: merchant
spec:
  serviceName: seq
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
      - name: seq
        image: datalust/seq:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SEQ_FIRSTRUN_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: seq-admin-password
        - name: SEQ_FIRSTRUN_ENFORCEPASSWORDCOMPLEXITY
          value: "false"
        livenessProbe:
          httpGet:
            path: /api
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: seq-data
          mountPath: /data
      volumes:
      - name: seq-data
        persistentVolumeClaim:
          claimName: seq-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seq-data
  namespace: merchant
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: seq
  namespace: merchant
spec:
  ports:
  - port: 5341
    targetPort: 80
    name: http
  selector:
    app: seq
  type: ClusterIP