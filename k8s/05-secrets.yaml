# ========================================
# Secrets (敏感信息)
# ========================================
apiVersion: v1
kind: Secret
metadata:
  name: merchant-secrets
  namespace: merchant
type: Opaque
stringData:
  sqlserver-sa-password: "YourStrong!Passw0rd123"
  seq-admin-password: "12345678"
---
# ========================================
# ConfigMap (非敏感配置)
# ========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: merchant-config
  namespace: merchant
data:
  # Seq 连接地址（供 API 服务使用）
  seq-server: "http://seq:5341"
  # Redis 连接地址
  redis-server: "redis:6379"
  # RabbitMQ 连接地址
  rabbitmq-server: "amqp://rabbitmq:5672"