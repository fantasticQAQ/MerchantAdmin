# ========================================
# Merchant API
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-api
  namespace: merchant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-api
  template:
    metadata:
      labels:
        app: merchant-api
    spec:
      initContainers:
      - name: db-migrate
        image: merchant-api:latest
        command: ["dotnet", "ef", "database", "update"]
        env:
        - name: ConnectionStrings__Default
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: sqlserver-connectionString
      containers:
      - name: merchant-api
        image: merchant-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ConnectionStrings__Default
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: sqlserver-connectionString
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: redis-connectionString
        - name: RabbitMQ__HostName
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: rabbitMQ-hostName
        - name: Serilog__WriteTo__1__Args__serverUrl
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: seq-serverUrl
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-api
  namespace: merchant
spec:
  ports:
  - port: 5002
    targetPort: 8080
    name: http
  selector:
    app: merchant-api
  type: ClusterIP