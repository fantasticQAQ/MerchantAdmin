# ========================================
# Nginx Ingress — 统一入口，路径转发
# ========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: merchant-ingress
  namespace: merchant
  annotations:
    # 超时设置
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # 路径重写：把 /api/merchant/xxx 重写成 /api/xxx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  # ===== 前端（默认入口）=====
  - host: merchant.local
    http:
      paths:
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: merchantadmin
            port:
              number: 80

  # ===== Merchant API =====
  - host: merchant.local
    http:
      paths:
      - path: /api/merchant(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: merchant-api
            port:
              number: 5002

  # ===== Identity API =====
  - host: merchant.local
    http:
      paths:
      - path: /api/identity(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-api
            port:
              number: 5001

  # ===== Seq 日志 =====
  - host: seq.local
    http:
      paths:
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: seq
            port:
              number: 5341

  # ===== RabbitMQ 管理后台 =====
  - host: rabbitmq.local
    http:
      paths:
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: rabbitmq
            port:
              number: 15672
---
# ========================================
# 前端 NodePort Service（方便本地访问）
# ========================================
apiVersion: v1
kind: Service
metadata:
  name: merchantadmin-nodeport
  namespace: merchant
spec:
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
  selector:
    app: merchantadmin
  type: NodePort