apiVersion: batch/v1
kind: Job
metadata:
  name: identity-db-migrate
  namespace: merchant
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: db-migrator:latest
        command: ["dotnet", "ef", "database", "update"]
        args:
        - "--project"
        - "Identity.API/Identity.API.csproj"  # ← 改成你实际的路径
        - "--startup-project"
        - "Identity.API/Identity.API.csproj"  # ← 改成你实际的路径
        env:
        - name: ConnectionStrings__Default
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: sqlserver-connectionString