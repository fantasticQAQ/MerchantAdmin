apiVersion: batch/v1
kind: Job
metadata:
  name: merchant-db-migrate
  namespace: merchant
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: db-migrator:latest
        command: ["dotnet", "ef", "database", "update"]
        args:
        - "--project"
        - "MerchantAdmin.Infrastructure/MerchantAdmin.Infrastructure.csproj"
        - "--startup-project"
        - "MerchantAdmin.API/MerchantAdmin.API.csproj"
        env:
        - name: ConnectionStrings__Default
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: sqlserver-connectionString