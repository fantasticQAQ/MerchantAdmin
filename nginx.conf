events {}

http {
	include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream frontend_static {
        server frontend:80;
    }

    server {
        listen 80;
		server_name localhost;

		# 统一入口：前端静态文件转发到 frontend 容器（纯静态服务）
		location / {
            proxy_pass http://frontend_static;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

        # Identity 服务
        location /api/identity/ {
            proxy_pass http://identity-api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Merchant 服务
        location /api/merchant/ {
            proxy_pass http://merchant-api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment 服务（支付回调）
        location /api/payment/ {
            proxy_pass http://payment-api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
