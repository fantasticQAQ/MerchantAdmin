worker_processes auto;

events {
    # 默认只有 512，且 nginx 的 worker_connections 要同时算「客户端连接」和「上游连接」，
    # 所以约 256 个并发代理请求就会耗尽，错误日志出现：
    #   [alert] 512 worker_connections are not enough while connecting to upstream
    worker_connections 10240;
}

http {
	include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Docker 内置 DNS（127.0.0.11）。容器重建后 IP 会变，而 nginx 对写死主机名的
    # proxy_pass 只在启动时解析一次并永久缓存，于是重新部署后接口会一直打到旧 IP，
    # 表现为 404/502，非得重启 nginx 才能恢复。
    # 改成「变量式 proxy_pass + resolver」后，缓存按 valid 到期，nginx 会重新解析上游。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
		server_name localhost;

		# 统一入口：前端静态文件转发到 frontend 容器（纯静态服务）
		location / {
            set $upstream_frontend http://frontend:80;
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

        # Identity 服务
        location /api/identity/ {
            # proxy_pass 里带变量时，nginx 不再做 location 前缀替换，路径改写必须自己写：
            # /api/identity/xxx -> identity-api:8080/api/xxx
            set $upstream_identity http://identity-api:8080;
            rewrite ^/api/identity/(.*)$ /api/$1 break;
            proxy_pass $upstream_identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Merchant 服务
        location /api/merchant/ {
            set $upstream_merchant http://merchant-api:8080;
            rewrite ^/api/merchant/(.*)$ /api/$1 break;
            proxy_pass $upstream_merchant;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment 服务（支付回调）
        location /api/payment/ {
            set $upstream_payment http://payment-api:8080;
            rewrite ^/api/payment/(.*)$ /api/$1 break;
            proxy_pass $upstream_payment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
